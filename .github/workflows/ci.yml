name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Fails loudly if nixpkgs has moved any pinned tool, or if the MoonBit
      # archives no longer hash to what tools/toolchain.json records.
      - name: Check toolchain pins
        run: nix flake check --print-build-logs

      - name: Build
        run: nix develop --command dotnet build --configuration Release
        env:
          ContinuousIntegrationBuild: "true"

      # The differential run has a step of its own below, so that a disagreement between C#
      # and wasm is attributed to it rather than to the unit tests.
      - name: Test
        run: nix develop --command dotnet test --configuration Release --no-build --logger "console;verbosity=normal" --filter "FullyQualifiedName!~CsWasm.Spike"

      - name: cswasm --version
        run: nix develop --command dotnet run --project src/Driver --configuration Release --no-build -- --version

      - name: cswasm toolchain
        run: nix develop --command dotnet run --project src/Driver --configuration Release --no-build -- toolchain

      # Proves the pinned MoonBit can actually produce and validate a WasmGC module,
      # which is the whole reason the backend exists.
      - name: MoonBit wasm-gc smoke
        run: nix develop --command tools/moonbit-smoke.sh

      # The completion condition of issue #18: the same C# run by .NET and by the pinned Node
      # on the module cswasm produced, compared field by field. A disagreement fails CI here.
      - name: .NET vs wasm differential (Node host)
        run: nix develop --command dotnet test tests/Spike/CsWasm.Spike.Differential --configuration Release --no-build --logger "console;verbosity=normal"
